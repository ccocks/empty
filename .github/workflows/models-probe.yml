name: gh-models-probe

on:
  workflow_dispatch:
  push:
    branches: [notebook-ci]

permissions:
  models: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Can a runner reach GitHub Models?
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "curl: $(curl --version | head -1)"
          echo "--- DNS ---"
          getent hosts models.github.ai || echo "no DNS answer"

          echo "--- catalog ---"
          curl -s -o /tmp/cat.json -w 'catalog HTTP %{http_code} ctype=%{content_type} bytes=%{size_download}\n' \
            -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' \
            https://models.github.ai/catalog/models || true
          head -c 400 /tmp/cat.json 2>/dev/null; echo

          echo "--- chat completion (openai/gpt-4o-mini) ---"
          curl -s -o /tmp/chat.json -w 'inference HTTP %{http_code} ctype=%{content_type} bytes=%{size_download}\n' \
            -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"reply with the single word OK"}],"max_tokens":8}' \
            https://models.github.ai/inference/chat/completions || true
          head -c 800 /tmp/chat.json 2>/dev/null; echo


          echo "--- chat completion (deepseek/DeepSeek-V3-0324) ---"
          curl -s -o /tmp/chat2.json -w 'inference2 HTTP %{http_code} ctype=%{content_type} bytes=%{size_download}\n' \
            -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
            -d '{"model":"deepseek/DeepSeek-V3-0324","messages":[{"role":"user","content":"reply with the single word OK"}],"max_tokens":8}' \
            https://models.github.ai/inference/chat/completions || true
          head -c 800 /tmp/chat2.json 2>/dev/null; echo
